<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#9D174D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Love Space">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Our Love Space 💌</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #7B1D3C; }
  body { font-family: Georgia, serif; display: flex; justify-content: center; }

  #app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #FFF8F5; overflow: hidden; }

  /* Header */
  #header { background: linear-gradient(160deg,#7B1D3C,#C0395E); color: white; padding: 14px 14px 10px; flex-shrink: 0; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  #header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  #app-title { font-size: 20px; font-weight: bold; }
  #app-sub   { font-size: 11px; opacity: .72; margin-top: 2px; }
  #hdr-btns  { display: flex; gap: 6px; }
  .hdr-btn   { background: rgba(255,255,255,.18); border: none; color: white; border-radius: 8px; padding: 6px 9px; font-size: 15px; cursor: pointer; }

  /* Notification bell badge */
  #bell-wrap { position: relative; }
  #bell-dot  { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; border: 1.5px solid #9D174D; display: none; }
  #bell-dot.on { display: block; }

  /* Switcher */
  #switcher { display: flex; background: rgba(0,0,0,.22); border-radius: 10px; padding: 3px; gap: 4px; }
  .user-tab { flex: 1; padding: 9px 6px; border-radius: 7px; border: none; cursor: pointer; font-family: Georgia,serif; font-size: 14px; transition: all .15s; background: transparent; color: rgba(255,255,255,.78); }
  .user-tab.active { background: rgba(255,255,255,.91); font-weight: bold; }
  .user-tab.active.husband { color: #1E40AF; }
  .user-tab.active.wife    { color: #9D174D; }

  /* Prompt */
  #prompt-card { margin: 10px 12px 4px; background: white; border-radius: 14px; padding: 10px 13px; border: 1px solid #FCE7F3; flex-shrink: 0; }
  #prompt-label { font-size: 9px; color: #BE185D; font-weight: bold; letter-spacing: .7px; text-transform: uppercase; margin-bottom: 3px; }
  #prompt-text  { font-size: 13px; color: #4A1030; font-style: italic; line-height: 1.5; }

  /* Messages */
  #msg-list { flex: 1; overflow-y: auto; padding: 6px 12px 10px; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
  #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 30px 20px; color: #9B4E6A; }
  .e-icon  { font-size: 52px; margin-bottom: 14px; }
  .e-title { font-size: 18px; font-weight: bold; color: #7B1D3C; margin-bottom: 8px; }
  .e-sub   { font-size: 13px; opacity: .7; line-height: 1.6; }

  .date-divider { display: flex; align-items: center; gap: 8px; margin: 10px 0 7px; }
  .date-divider .line  { flex: 1; height: 1px; background: #FCE7F3; }
  .date-divider .label { font-size: 10px; color: #BE185D; opacity: .65; }

  .msg-row { display: flex; align-items: flex-end; gap: 7px; margin-bottom: 7px; }
  .msg-row.me   { flex-direction: row-reverse; }
  .msg-row.them { flex-direction: row; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #FCE7F3; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .avatar.hidden { visibility: hidden; }
  .msg-col { max-width: 72%; display: flex; flex-direction: column; }
  .msg-row.me   .msg-col { align-items: flex-end; }
  .msg-row.them .msg-col { align-items: flex-start; }
  .sender-label { font-size: 11px; font-weight: bold; margin-bottom: 3px; }
  .bubble { padding: 10px 13px; font-size: 15px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; -webkit-user-select: none; user-select: none; }
  .bubble.hb { background: #DBEAFE; color: #1E3A5F; border: 1px solid #93C5FD; border-radius: 16px 4px 16px 16px; }
  .bubble.wb { background: #FCE7F3; color: #5B1039; border: 1px solid #F9A8D4; border-radius: 4px 16px 16px 16px; }
  .msg-meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
  .msg-row.me   .msg-meta { flex-direction: row-reverse; }
  .msg-row.them .msg-meta { flex-direction: row; }
  .msg-time  { font-size: 10px; color: #9B6B7A; opacity: .6; }
  .heart-btn { font-size: 12px; cursor: pointer; border: none; background: transparent; padding: 2px; color: #BE185D; font-family: inherit; }
  .heart-btn.on { background: #FCE7F3; border: 1px solid #F9A8D4; border-radius: 20px; padding: 2px 6px; }

  /* Input */
  #input-area { padding: 9px 12px 20px; background: white; border-top: 1px solid #FCE7F3; display: flex; gap: 9px; align-items: flex-end; flex-shrink: 0; }
  #msg-input  { flex: 1; min-height: 44px; max-height: 120px; padding: 11px 13px; border-radius: 20px; border: 1.5px solid #F9A8D4; font-family: Georgia,serif; font-size: 15px; color: #4A1030; background: #FFF8F5; outline: none; resize: none; overflow-y: auto; line-height: 1.4; }
  #send-btn   { width: 46px; height: 46px; border-radius: 50%; border: none; background: #F5D0E0; color: white; font-size: 20px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; }
  #send-btn.active { background: #BE185D; }
  #send-btn:active { transform: scale(.9); }

  /* In-app toast */
  #toast { position: fixed; top: -110px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 456px; background: white; border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 32px rgba(80,10,30,.28); border-left: 5px solid #BE185D; display: flex; align-items: center; gap: 13px; transition: top 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index: 300; cursor: pointer; }
  #toast.show { top: 12px; }
  .t-emoji { font-size: 28px; flex-shrink: 0; }
  .t-body  { flex: 1; min-width: 0; }
  .t-from  { font-size: 12px; font-weight: bold; color: #BE185D; margin-bottom: 2px; }
  .t-msg   { font-size: 14px; color: #4A1030; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-x     { color: #ccc; font-size: 18px; flex-shrink: 0; }

  /* Permission banner */
  #perm-banner { margin: 6px 12px 0; border-radius: 12px; padding: 10px 13px; background: #FFF7ED; border: 1px solid #FED7AA; display: none; align-items: center; gap: 10px; flex-shrink: 0; }
  #perm-banner.show { display: flex; }
  #perm-banner span { flex: 1; font-size: 13px; color: #92400E; line-height: 1.4; }
  #perm-banner .pb-allow { border: none; background: #BE185D; color: white; padding: 6px 13px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: Georgia,serif; white-space: nowrap; }
  #perm-banner .pb-x { border: none; background: transparent; color: #92400E; font-size: 17px; cursor: pointer; opacity: .6; padding: 2px; }

  /* Clear dialog */
  #dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(80,10,30,.48); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
  #dialog-overlay.show { display: flex; }
  #dialog-box { background: white; border-radius: 18px; padding: 26px 22px; max-width: 300px; width: 100%; text-align: center; }
  .d-icon  { font-size: 38px; margin-bottom: 12px; }
  .d-title { font-size: 18px; color: #4A1030; margin-bottom: 8px; font-weight: bold; }
  .d-msg   { font-size: 13px; color: #9B6B7A; line-height: 1.6; margin-bottom: 20px; }
  .d-btns  { display: flex; gap: 10px; }
  .d-btns button { flex: 1; padding: 11px; border-radius: 11px; font-size: 15px; cursor: pointer; font-family: Georgia,serif; }
  #d-keep  { background: white; border: 1.5px solid #FCE7F3; color: #BE185D; }
  #d-clear { background: #BE185D; border: none; color: white; font-weight: bold; }

  #msg-list::-webkit-scrollbar { width: 3px; }
  #msg-list::-webkit-scrollbar-thumb { background: #F9A8D4; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <!-- Toast -->
  <div id="toast" onclick="dismissToast()">
    <div class="t-emoji" id="t-emoji">💌</div>
    <div class="t-body"><div class="t-from" id="t-from"></div><div class="t-msg" id="t-msg"></div></div>
    <div class="t-x">✕</div>
  </div>

  <!-- Header -->
  <div id="header">
    <div id="header-top">
      <div>
        <div id="app-title">💌 Our Love Space</div>
        <div id="app-sub">Just the two of us</div>
      </div>
      <div id="hdr-btns">
        <div id="bell-wrap">
          <button class="hdr-btn" id="bell-btn" onclick="handleBell()" title="Notifications">🔔</button>
          <div id="bell-dot"></div>
        </div>
        <button class="hdr-btn" onclick="askClear()">🗑</button>
      </div>
    </div>
    <div id="switcher">
      <button class="user-tab husband active" onclick="switchUser('husband')">💙 Dudu</button>
      <button class="user-tab wife"           onclick="switchUser('wife')">🌹 Bubu</button>
    </div>
  </div>

  <!-- Notification permission banner -->
  <div id="perm-banner">
    <span>🔔 Allow notifications so you never miss a love note!</span>
    <button class="pb-allow" onclick="requestPerm()">Allow</button>
    <button class="pb-x" onclick="dismissBanner()">✕</button>
  </div>

  <!-- Daily Prompt -->
  <div id="prompt-card">
    <div id="prompt-label">💝 Today's love prompt</div>
    <div id="prompt-text"></div>
  </div>

  <!-- Messages -->
  <div id="msg-list"></div>

  <!-- Input -->
  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="Write a love note… 💌"
      oninput="onInput(this)" onkeydown="onKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">💌</button>
  </div>
</div>

<!-- Clear dialog -->
<div id="dialog-overlay">
  <div id="dialog-box">
    <div class="d-icon">💔</div>
    <div class="d-title">Clear all notes?</div>
    <div class="d-msg">This permanently deletes every love note.</div>
    <div class="d-btns">
      <button id="d-keep" onclick="closeDialog()">Keep</button>
      <button id="d-clear" onclick="confirmClear()">Delete All</button>
    </div>
  </div>
</div>

<script>
const PROMPTS = [
  "What's your favourite memory of us? 💭",
  "What made you smile today? ✨",
  "What do you love about our life together? 🏡",
  "Something you're grateful for right now? 🙏",
  "What adventure should we take next? 🌍",
  "A song that always reminds you of us? 🎵",
  "What's your dream date with me? 🌹",
];
const USERS = {
  husband: { short:"You", emoji:"💙", bc:"hb", lc:"#1E40AF", label:"Love note for Wife 🌹" },
  wife:    { short:"Wife",emoji:"🌹", bc:"wb", lc:"#9D174D", label:"Love note for You 💙"  },
};

let messages    = [];
let currentUser = "husband";
let toastTimer  = null;
let swReg       = null;
let audioCtx    = null;

// ── Service Worker ────────────────────────────
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(reg => {
    swReg = reg;
    console.log("SW registered");
  }).catch(e => console.log("SW error", e));
}

// ── Audio chime ───────────────────────────────
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {}
  }
  return audioCtx;
}
function playChime() {
  const ctx = getAudio(); if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  const now = ctx.currentTime;
  [[659.3,0],[830.6,.12],[987.8,.24],[1318.5,.38]].forEach(([freq,d]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.setValueAtTime(freq, now+d);
    g.gain.setValueAtTime(0, now+d);
    g.gain.linearRampToValueAtTime(0.18, now+d+.04);
    g.gain.exponentialRampToValueAtTime(.001, now+d+.9);
    o.start(now+d); o.stop(now+d+.95);
  });
}
function vibrate() {
  try { if (navigator.vibrate) navigator.vibrate([150,60,150]); } catch(_) {}
}

// ── Notifications ─────────────────────────────
function checkPermState() {
  if (!("Notification" in window)) return;
  const p = Notification.permission;
  const dot = document.getElementById("bell-dot");
  if (p === "granted") {
    dot.classList.add("on");
    document.getElementById("perm-banner").classList.remove("show");
  } else if (p === "default") {
    dot.classList.remove("on");
    const dismissed = localStorage.getItem("love-perm-dismissed");
    if (!dismissed) document.getElementById("perm-banner").classList.add("show");
  } else {
    dot.classList.remove("on");
  }
}

function requestPerm() {
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(p => {
    checkPermState();
    if (p === "granted") {
      showToast("🎉","Notifications on!","You'll get alerts for every love note 💌");
    } else {
      localStorage.setItem("love-perm-dismissed","1");
    }
  });
}

function handleBell() {
  if (!("Notification" in window)) {
    showToast("⚠️","Not supported","Your browser doesn't support notifications");
    return;
  }
  if (Notification.permission === "granted") {
    showToast("✅","Notifications are ON","You'll get alerts for every love note 💌");
  } else if (Notification.permission === "denied") {
    showToast("⚠️","Notifications blocked","Go to Chrome Settings → Site Settings → Notifications to allow");
  } else {
    requestPerm();
  }
}

function dismissBanner() {
  document.getElementById("perm-banner").classList.remove("show");
  localStorage.setItem("love-perm-dismissed","1");
}

function fireNotification(msg) {
  const info   = USERS[msg.sender];
  const preview = msg.text.length > 60 ? msg.text.slice(0,60)+"…" : msg.text;

  // In-app toast (always)
  showToast(info.emoji, info.label, preview);
  playChime();
  vibrate();

  // System notification via service worker (works even when screen is off)
  if ("Notification" in window && Notification.permission === "granted") {
    if (swReg && swReg.active) {
      swReg.active.postMessage({
        type: "SHOW_NOTIFICATION",
        title: info.label,
        body:  preview,
      });
    } else {
      // Fallback: direct notification
      try {
        const n = new Notification(info.label, { body: preview, tag:"love-note", renotify:true });
        setTimeout(() => n.close(), 6000);
      } catch(_) {}
    }
  }
}

// ── Toast ─────────────────────────────────────
function showToast(emoji, from, msg) {
  document.getElementById("t-emoji").textContent = emoji;
  document.getElementById("t-from").textContent  = from;
  document.getElementById("t-msg").textContent   = msg;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}
function dismissToast() {
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
}

// ── Init ──────────────────────────────────────
function init() {
  document.getElementById("prompt-text").textContent =
    PROMPTS[new Date().getDay() % PROMPTS.length];
  try {
    const s = localStorage.getItem("love-messages");
    if (s) messages = JSON.parse(s);
  } catch(_) {}
  try {
    const u = localStorage.getItem("love-user");
    if (u==="husband"||u==="wife") currentUser=u;
  } catch(_) {}
  updateSwitcher(); renderMessages(); updatePlaceholder();
  checkPermState();
}

// ── User switch ───────────────────────────────
function switchUser(u) {
  currentUser = u;
  try { localStorage.setItem("love-user",u); } catch(_) {}
  updateSwitcher(); updatePlaceholder(); renderMessages();
}
function updateSwitcher() {
  document.querySelectorAll(".user-tab").forEach(b =>
    b.classList.toggle("active", b.classList.contains(currentUser)));
}
function updatePlaceholder() {
  document.getElementById("msg-input").placeholder =
    `Write to ${currentUser==="husband"?"your wife":"your husband"}… 💌`;
}

// ── Send ──────────────────────────────────────
function sendMessage() {
  const inp = document.getElementById("msg-input");
  const text = inp.value.trim(); if (!text) return;
  getAudio(); // wake audio context on user gesture
  const msg = {
    id: Date.now(), text, sender: currentUser,
    time: new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
    date: new Date().toLocaleDateString(), hearts: 0,
  };
  messages.push(msg); persist();
  inp.value=""; inp.style.height="44px";
  document.getElementById("send-btn").classList.remove("active");
  renderMessages(); scrollBottom(); inp.focus();
  fireNotification(msg);
}

// ── Hearts ────────────────────────────────────
function addHeart(id) {
  const m = messages.find(m=>m.id===id); if(!m) return;
  m.hearts=(m.hearts||0)+1; persist();
  const b = document.querySelector(`.heart-btn[data-id="${id}"]`);
  if(b){b.textContent=`❤️ ${m.hearts}`;b.classList.add("on");}
}

// ── Render ────────────────────────────────────
function fmtDate(d){
  const t=new Date().toLocaleDateString(),y=new Date(Date.now()-86400000).toLocaleDateString();
  return d===t?"Today":d===y?"Yesterday":d;
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderMessages(){
  const list=document.getElementById("msg-list");
  if(!messages.length){
    list.innerHTML=`<div id="empty-state">
      <div class="e-icon">💑</div>
      <div class="e-title">Start Your Story</div>
      <div class="e-sub">Tap your name above,<br>then send your first love note!</div>
    </div>`;
    return;
  }
  const groups={};
  for(const m of messages){if(!groups[m.date])groups[m.date]=[];groups[m.date].push(m);}
  let html="";
  for(const [date,msgs] of Object.entries(groups)){
    html+=`<div class="date-divider"><div class="line"></div><span class="label">${fmtDate(date)}</span><div class="line"></div></div>`;
    msgs.forEach((msg,i)=>{
      const isMe=msg.sender===currentUser, info=USERS[msg.sender];
      const showLbl=i===0||msgs[i-1].sender!==msg.sender;
      const hbtn=msg.hearts>0
        ?`<button class="heart-btn on" data-id="${msg.id}" onclick="addHeart(${msg.id})">❤️ ${msg.hearts}</button>`
        :`<button class="heart-btn"    data-id="${msg.id}" onclick="addHeart(${msg.id})">🤍</button>`;
      html+=`<div class="msg-row ${isMe?"me":"them"}">
        ${!isMe?`<div class="avatar ${showLbl?"":"hidden"}">${info.emoji}</div>`:""}
        <div class="msg-col">
          ${showLbl?`<div class="sender-label" style="color:${info.lc}">${info.short}</div>`:""}
          <div class="bubble ${info.bc}" ondblclick="addHeart(${msg.id})">${esc(msg.text)}</div>
          <div class="msg-meta"><span class="msg-time">${msg.time}</span>${hbtn}</div>
        </div>
      </div>`;
    });
  }
  list.innerHTML=html;
}
function scrollBottom(){
  const l=document.getElementById("msg-list");l.scrollTop=l.scrollHeight;
}

// ── Storage ───────────────────────────────────
function persist(){try{localStorage.setItem("love-messages",JSON.stringify(messages));}catch(_){}}

// ── Clear ─────────────────────────────────────
function askClear(){if(messages.length)document.getElementById("dialog-overlay").classList.add("show");}
function closeDialog(){document.getElementById("dialog-overlay").classList.remove("show");}
function confirmClear(){messages=[];persist();closeDialog();renderMessages();}
document.getElementById("dialog-overlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeDialog();});

// ── Input ─────────────────────────────────────
function onInput(ta){
  ta.style.height="44px";ta.style.height=Math.min(ta.scrollHeight,120)+"px";
  document.getElementById("send-btn").classList.toggle("active",ta.value.trim().length>0);
}
function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}

init();
</script>
</body>
</html>
